<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Seam Prologue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500&display=swap">
<style>
:root{--ink:#0b0705;--gold:#e9b86a;--cream:#f3e3c4;--muted:rgba(243,227,196,.62);--glass:rgba(20,12,8,.5);--line:rgba(233,184,106,.22)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--cream);cursor:none}
#stage{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.chapter{position:absolute;left:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);text-shadow:0 1px 14px rgba(0,0,0,.7)}
.chapter small{display:block;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:.85}
.chapter h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(26px,3.6vw,42px);line-height:1.05;margin-top:6px}
.chapter p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(15px,1.5vw,18px);color:var(--muted);margin-top:4px}
.tools{position:absolute;right:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);display:flex;gap:10px;pointer-events:auto;z-index:8}
.tool{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--cream);transition:transform .25s,border-color .25s,background .25s;cursor:none;padding:0}
.tool:hover,.tool.active{transform:translateY(-2px);border-color:rgba(233,184,106,.7);background:rgba(40,24,14,.7)}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#2a1709;font-size:10px;font-weight:500;display:grid;place-items:center;padding:0 5px}
.tool .badge:empty{display:none}
.tool.bump{animation:bump .6s}
.tool .tip{position:absolute;top:56px;right:0;white-space:nowrap;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--glass);border:1px solid var(--line);opacity:0;transform:translateY(-4px);transition:.2s;pointer-events:none}
@media (hover:hover){.tool:hover .tip{opacity:1;transform:none}}
.tool.snd .off{display:none}.tool.snd.muted .on{display:none}.tool.snd.muted .off{display:block}.tool.snd.muted{color:var(--muted)}
.tool.look{display:none}
.purse{position:absolute;right:clamp(16px,4vw,48px);top:calc(clamp(16px,4vh,40px) + 58px);font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:right;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.purse b{color:var(--cream);font-weight:500;font-variant-numeric:tabular-nums}
.sub{position:absolute;left:50%;bottom:clamp(20px,6vh,56px);transform:translateX(-50%);width:min(780px,calc(100% - 32px));text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
.sub.on{opacity:1}
.sub .who{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;text-shadow:0 1px 8px #000}
.sub .line{font-family:"Cormorant Garamond",serif;font-size:clamp(20px,2.4vw,28px);line-height:1.3;text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 2px #000}
.choices{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:14px;pointer-events:auto}
.choices button,.btn{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid rgba(233,184,106,.45);background:rgba(20,12,8,.72);backdrop-filter:blur(8px);color:var(--cream);cursor:none;transition:background .15s,color .15s,transform .15s;max-width:100%}
.choices button:hover,.choices button:focus-visible,.btn:hover,.btn:focus-visible{background:var(--gold);color:#2a1709;outline:none}
.hs{position:absolute;pointer-events:auto;cursor:none;border-radius:12px}
.exit{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:rgba(24,10,8,.62);border:1.5px solid rgba(220,70,56,.9);box-shadow:0 0 0 4px rgba(220,70,56,.15),0 6px 18px rgba(0,0,0,.4);pointer-events:auto;cursor:none;padding:0;z-index:4;transition:transform .2s,background .2s;animation:exitPulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.exit:hover{transform:scale(1.12);background:rgba(160,36,28,.85)}
.exit svg{width:24px;height:24px;fill:none;stroke:#ff6a58;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.exit:hover svg{stroke:#fff1e8}
.exit.right svg{transform:rotate(180deg)}.exit.up svg{transform:rotate(90deg)}.exit.down svg{transform:rotate(-90deg)}
@keyframes exitPulse{50%{box-shadow:0 0 0 9px rgba(220,70,56,.04),0 6px 18px rgba(0,0,0,.4)}}
.hs::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--cream);opacity:0;transition:opacity .4s}
body.reveal .hs::after{opacity:.6;animation:ping 2.2s infinite}
body.busy .hs{pointer-events:none}
.label{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .2s;text-align:center;white-space:nowrap;z-index:5}
.label.on{opacity:1}
.label .name{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 3px #000}
.label .verbs{margin-top:8px;display:none;gap:6px;justify-content:center;flex-wrap:wrap}
.label.open{pointer-events:auto}.label.open .verbs{display:flex}
.label .verbs button{font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid rgba(233,184,106,.45);backdrop-filter:blur(8px);color:var(--cream);cursor:none}
.label .verbs button:hover{color:#2a1709;background:var(--gold)}
#cursor{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border:1px solid rgba(243,227,196,.75);border-radius:50%;pointer-events:none;transition:width .2s,height .2s,margin .2s,border-color .2s,background .2s;z-index:40}
#cursor::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:var(--cream)}
#cursor.hot{width:44px;height:44px;margin:-22px 0 0 -22px;border-color:var(--gold);background:rgba(233,184,106,.08)}
#holding{position:fixed;left:0;top:0;pointer-events:none;z-index:39;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--gold);color:#2a1709;white-space:nowrap;display:none;transform:translate(22px,18px)}
#holding.touch{left:50%;top:auto;bottom:calc(clamp(20px,6vh,56px) + 90px);transform:translateX(-50%);pointer-events:auto;font-size:13px;padding:8px 14px}
body.holding #holding{display:block}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:rgba(243,227,196,.4);white-space:nowrap}
.panel{position:absolute;right:clamp(16px,4vw,48px);top:calc(clamp(16px,4vh,40px) + 84px);width:min(390px,calc(100% - 32px));max-height:calc(100% - 210px);overflow:auto;background:rgba(18,11,7,.88);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:18px;pointer-events:auto;opacity:0;transform:translateY(-6px);transition:opacity .22s,transform .22s,visibility .22s;visibility:hidden;z-index:6}
.panel.on{opacity:1;transform:none;visibility:visible}
.panel h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:26px;margin-bottom:4px}
.panel .sub2{font-size:12px;color:var(--muted);margin-bottom:14px}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--cream);font:inherit;font-size:11px;line-height:1.25;text-align:center;cursor:none;min-width:0}
.item:hover{border-color:rgba(233,184,106,.6)}
.item.sel{border-color:var(--gold);background:rgba(233,184,106,.14)}
.item svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.desc{margin-top:14px;font-family:"Cormorant Garamond",serif;font-size:19px;line-height:1.35}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:12px}
.list .row b{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:500;display:block}
.list .row span{font-size:13px;color:var(--muted);line-height:1.45}
.goal{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px;line-height:1.4}
.goal i{width:13px;height:13px;border:1px solid var(--gold);border-radius:3px;margin-top:3px}
.goal.done{color:var(--muted)}.goal.done i{background:var(--gold)}
.empty{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:18px;color:var(--muted)}
.toast{position:absolute;left:50%;top:clamp(84px,12vh,120px);transform:translate(-50%,-8px);background:rgba(18,11,7,.86);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;z-index:7;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--gold);font-weight:500}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,5,3,.9);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;padding:24px 16px;cursor:auto}
.overlay.on{opacity:1;visibility:visible}
.overlay button{cursor:pointer}
.card{text-align:center;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:14px}
.card small{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.card h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,7vw,72px);line-height:1}
.card p{font-family:"Cormorant Garamond",serif;font-size:clamp(18px,2.2vw,22px);line-height:1.45;color:var(--muted)}
.card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.card a{color:var(--gold)}
#fade{position:fixed;inset:0;background:#050302;opacity:0;pointer-events:none;transition:opacity .7s;z-index:25;display:grid;place-items:center}
#fade.on{opacity:1;pointer-events:auto}
#fade p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(20px,2.6vw,28px);color:var(--cream);opacity:.85;text-align:center;padding:0 24px;max-width:700px}
.map{width:min(900px,100%);display:flex;flex-direction:column;gap:12px}
.map h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:32px;text-align:center}
.mapbox{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#1b130d}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--cream);font:inherit;padding:6px}
.pin i{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(233,184,106,.25)}
.pin span{font-family:"Cormorant Garamond",serif;font-size:clamp(14px,2vw,19px);white-space:nowrap;text-shadow:0 1px 6px #000}
.pin em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.pin.here i{background:var(--cream)}
.pin:hover span,.pin:focus-visible span{color:var(--gold)}
.rub{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(640px,100%)}
.rub canvas{position:relative;width:100%;height:auto;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:none;cursor:crosshair}
.rub p{font-family:"Cormorant Garamond",serif;font-size:19px;color:var(--muted);text-align:center}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(243,227,196,.45)}80%,100%{box-shadow:0 0 0 14px rgba(243,227,196,0)}}
@keyframes bump{30%{transform:scale(1.18);border-color:var(--gold)}}
@media (pointer:coarse){.tool.look{display:grid}.tool{width:42px;height:42px}.label .verbs button{font-size:14px;padding:10px 16px}body.reveal .hs::after{opacity:.9}.hs::after{opacity:.35}}
@media (hover:none){body{cursor:auto}#cursor{display:none}}
@media (max-width:640px){.purse{top:calc(clamp(16px,4vh,40px) + 54px)}.tools{gap:6px}.chapter{top:calc(clamp(16px,4vh,40px) + 74px)}.chapter h1{font-size:24px}.chapter p{font-size:14px}}
@media (max-width:640px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage">
 <canvas id="c"></canvas>
 <div class="hud" id="hud">
  <div class="chapter"><small>Prologue</small><h1 id="chH">Bevan’s box</h1><p id="chP">London · September 1869</p></div>
  <div class="tools">
   <button class="tool snd muted" id="snd" aria-label="Music"><svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path d="M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg><span class="tip">Sound</span></button>
   <button class="tool look" id="look" aria-label="Show hotspots"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/><path d="M11 8v6M8 11h6"/></svg><span class="tip">Show hotspots</span></button>
   <button class="tool" data-tab="satchel" aria-label="Satchel"><svg viewBox="0 0 24 24"><path d="M4 9h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/><path d="M4 13h16"/></svg><span class="badge" id="bSatchel"></span><span class="tip">Satchel</span></button>
   <button class="tool" data-tab="pocket" aria-label="Pocketbook"><svg viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M6 3v18"/><path d="M10 8h5M10 12h5"/></svg><span class="tip">Pocketbook · what to do</span></button>
   <button class="tool" data-tab="ledger" aria-label="Ledger"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg><span class="badge" id="bLedger"></span><span class="tip">Ledger · people</span></button>
   <button class="tool" data-tab="secrets" aria-label="Secrets"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg><span class="badge" id="bSecrets"></span><span class="tip">Secrets</span></button>
  </div>
  <div class="purse" id="purse"></div>
  <div class="panel" id="panel" role="dialog" aria-label="Notebook"></div>
  <div class="toast" id="toast"></div>
  <div class="sub" id="sub"><div class="who" id="who"></div><div class="line" id="line"></div><div class="choices" id="choices"></div></div>
  <div class="hint" id="hint"></div>
 </div>
</div>
<div id="holding"></div>
<div id="fade"><p id="fadeP"></p></div>
<div class="overlay" id="ov"></div>
<div id="cursor"></div>
<script>
(()=>{
'use strict';
const VW=1600,VH=900;
const cv=document.getElementById('c'),main=cv.getContext('2d');let ctx=main;
const hud=document.getElementById('hud'),cur=document.getElementById('cursor'),stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,S,OX,OY,pan=0,maxPan=0;
const clampPan=p=>Math.max(-maxPan,Math.min(maxPan,p));
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.max(W/VW,Math.min(H/VH,W*1.9/VW));maxPan=Math.max(0,(VW*S-W)/2);pan=clampPan(pan);OX=(W-VW*S)/2+pan;OY=(H-VH*S)/2}
addEventListener('resize',resize);resize();
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P=f=>{const p=new Path2D();f(p);return p};
function rimFill(path,dark,rim,dx,dy){ctx.save();ctx.clip(path);ctx.fillStyle=rim;ctx.fill(path);ctx.translate(dx,dy);ctx.fillStyle=dark;ctx.fill(path);ctx.restore()}
const lg=(x0,y0,x1,y1,st)=>{const g=ctx.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g};
function glow(x,y,r,c,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore()}
let mx=0,my=0,tx=0,ty=0,mouse=!matchMedia('(pointer:coarse)').matches;
const off=d=>({x:-mx*d*30,y:0});
const grain=document.createElement('canvas');grain.width=grain.height=200;
{const g=grain.getContext('2d'),im=g.createImageData(200,200),r=rng(7);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}
const grainPat=main.createPattern(grain,'repeat');

/* ================= characters ================= */
const CR={
 legs:[P(p=>{p.moveTo(-16,-52);p.lineTo(-6,-52);p.lineTo(-7,-11);p.lineTo(-17,-11);p.closePath();p.moveTo(-18,-13);p.lineTo(-7,-13);p.quadraticCurveTo(-1,-7,3,-3);p.lineTo(3,0);p.lineTo(-19,0);p.closePath()}),
       P(p=>{p.moveTo(4,-52);p.lineTo(14,-52);p.lineTo(18,-11);p.lineTo(8,-11);p.closePath();p.moveTo(7,-13);p.lineTo(18,-13);p.quadraticCurveTo(24,-7,29,-3);p.lineTo(29,0);p.lineTo(6,0);p.closePath()})],
 coat:P(p=>{p.moveTo(-11,-204);p.quadraticCurveTo(-25,-199,-30,-187);p.quadraticCurveTo(-33,-160,-30,-128);p.quadraticCurveTo(-34,-88,-40,-48);p.quadraticCurveTo(-29,-42,-19,-45);p.lineTo(-12,-62);p.lineTo(-6,-44);p.quadraticCurveTo(15,-41,38,-47);p.quadraticCurveTo(34,-86,31,-124);p.quadraticCurveTo(33,-168,26,-188);p.quadraticCurveTo(17,-198,8,-200);p.closePath();
  p.moveTo(-15,-208);p.lineTo(-7,-195);p.lineTo(9,-195);p.lineTo(12,-203);p.quadraticCurveTo(0,-199,-15,-208);p.closePath()}),
 armR:P(p=>{p.moveTo(22,-185);p.quadraticCurveTo(37,-160,41,-118);p.lineTo(43,-110);p.lineTo(33,-107);p.lineTo(31,-118);p.quadraticCurveTo(28,-150,16,-172);p.closePath()}),
 hands:P(p=>{p.ellipse(38,-104,4.6,5,0,0,Math.PI*2);p.moveTo(-26,-104);p.ellipse(-30,-104,4,5.6,.2,0,Math.PI*2)}),
 head:P(p=>{p.moveTo(-11,-227);p.quadraticCurveTo(-16,-214,-12,-204);p.lineTo(-9,-197);p.lineTo(8,-196);p.quadraticCurveTo(13,-199,14,-203);p.lineTo(17,-205);p.lineTo(15.5,-208);p.lineTo(19,-211);p.lineTo(15.5,-217);p.quadraticCurveTo(14.5,-225,10,-228);p.closePath()}),
 bowler:P(p=>{p.moveTo(-14,-229);p.quadraticCurveTo(-15,-250,1,-251);p.quadraticCurveTo(16,-250,16,-229);p.closePath();p.moveTo(-21,-227);p.quadraticCurveTo(-17,-231.5,-8,-230.5);p.lineTo(10,-230.5);p.quadraticCurveTo(20,-231.5,23,-227.5);p.quadraticCurveTo(17,-224,0,-225);p.quadraticCurveTo(-16,-224,-21,-227);p.closePath()})};
const PAL={

const SAVE='blackseam-prologue-v2';
const fresh=()=>({scene:'office',inv:['watch'],flags:{},money:16,ledger:['grice','tom','bevan'],secrets:[],seen:{}});
let G=fresh();
const has=i=>G.inv.includes(i),F=f=>!!G.flags[f];
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(_){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s&&s.scene&&!s.flags.done)return s}catch(_){}return null}
function flag(f,v=true){G.flags[f]=v;save();ui()}
function give(i){if(!has(i)){G.inv.push(i);toast(`Satchel · <b>${ITEMS[i].name}</b>`);bump('satchel')}save();ui()}
function drop(i){G.inv=G.inv.filter(x=>x!==i);if(sel===i)setSel(null);save();ui()}
function addLedger(id){if(!G.ledger.includes(id)){G.ledger.push(id);toast(`Ledger · <b>${LEDGER[id][0]}</b>`);bump('ledger');G.seen.ledger=false}save();ui()}
function addSecret(id){if(!G.secrets.includes(id)){G.secrets.push(id);toast(`Secret · <b>${SECRETS[id][0]}</b>`);bump('secrets');G.seen.secrets=false}save();ui()}
function spend(d){G.money-=d;save();ui()}
function earn(d){G.money+=d;save();ui()}
const lsd=d=>{const l=Math.floor(d/240),s=Math.floor(d%240/12),p=d%12;const a=[];if(l)a.push('£'+l);if(s||l)a.push(s+'s');if(p||!a.length)a.push(p+'d');return a.join(' ')};

 const g=[];

  :!F('searched')?['Clear Mr Bevan’s desk and box up his effects for his daughter',false]
  :['Pack Bevan’s letter and spectacles in the tea chest, then nail it shut',false];

   :F('ordered')?(F('forgeReady')?['Collect the letter from Mrs Hatch’s. Mr Ellis has had his hour',false]:['Mr Ellis wants an hour with the letter. Something else to do, then back to Leather Lane',false])
   :!has('osletter')?['A letter that lets me walk other men’s land. The Ordnance Survey wrote to the firm; it’s in Grice’s pigeonholes, and Grice never leaves his desk',false]

  g.push(has('rticket')?['Bought a ticket to Cardiff',true]
   :G.money<270?['Raise the fare to Cardiff: second class is £1 2s 6d and I have '+lsd(G.money)+'. Something to pawn?',false]

  if(g.every(x=>x[1]))g.push(['Catch the down mail at Paddington',false])}

 panel.innerHTML=h;

async function talkTom(){
 if(F('osTaken')){await line('Tom','I got a clip round the ear for that, sir. Worth it though.');return}
 await line('Tom','Mr Bevan used to give me humbugs, sir. Now nobody does.');await speak('Life is hard, Tom.');await line('Tom','It’s harder without humbugs, sir.')}
async function pennyTom(){
 await speak('Tom. A penny says Mr Pike wants Mr Grice in the strongroom. Urgently.');
 await line('Tom','Mr Pike’s in Brighton, sir.');await speak('Mr Grice doesn’t know that.');await line('Tom','…Make it tuppence?');
 const c=await choose(G.money>=2?['A penny, Tom.','Tuppence, then.']:['A penny, Tom. It’s all I can spare.']);
 if(c===1){spend(2);await line('Tom','Pleasure doing business, sir.')}else{spend(1);await line('Tom','Robbery, that is.')}
 flag('tomSent');
 await line('Tom','Mr GRICE! Mr Pike wants you in the strongroom, sir! Urgent!');
 await line('Mr Grice','Mr Pike? He wasn’t in this morning…');await line('Mr Grice','Very well. Touch nothing, any of you.');
 flag('griceAway');await say('Now. Quickly.')}
async function openDrawer(){flag('drawer');await say('Pencils, a broken rule, and the stick of soft graphite Bevan gave me for taking rubbings.');give('graphite');await say('And a humbug, which I’ll keep from Tom.');give('humbug')}
async function searchDesk(){
 flag('searched');await say('His pen tray, his spectacles, a half-written letter.');give('specs');give('bletter');
 await say('A lump of coal with a paper label. And his field book.');give('coal');give('notebook');
 await say('And tucked in the field book, a pawn ticket. Mrs Hatch, Leather Lane. “One theodolite, five-inch, in case. J. Bevan.”');give('bticket');
 await say('His own instrument. He bought it the year I came here, and he never let anyone else carry it. He pawned it in May.')
 await say('His daughter gets the personal effects. The firm gets nothing. That’s what Grice said.');addLedger('gwen')}

 else if(c===2){for(const e of errs)await line('Mr Grice',e)}}

async function talkBeadle(){
 if(F('admitted')){await line('The beadle','Mr Dobbs is by the Hetton board, sir.');return}
 await line('The beadle','Members and their clerks only, sir. This is the Coal Exchange, not the Royal Exchange. We don’t let the public in to gawp.');
 await speak('I have business here.');await line('The beadle','Then you’ll have something to show for it.')}
async function showBeadle(){await line('The beadle','Hallam and Pike, for Mr Dobbs, by hand. Very good, sir.');await line('The beadle','Mr Dobbs is on the floor, by the Hetton board. Stout gentleman, can’t miss him.');flag('admitted')}
async function talkDobbs(){
 if(!F('delivered')){if(has('hlletter')){await deliver()}else await say('I have nothing for him.');return}
 if(!F('valued')){await line('Mr Dobbs','Anything else, Mr Crane? I’ve a cargo of Lambton going cold.');if(has('coal'))await say('I’ve something he might look at.');return}
 await line('Mr Dobbs','Remember what I told you, Mr Crane. Rich man or dead one.')}
async function deliver(){
 await speak('Mr Dobbs? From Mr Hallam, by hand.');drop('hlletter');flag('delivered');addLedger('dobbs');
 await line('Mr Dobbs','Hallam! Wants Welsh prices again, I’ll wager. Everybody wants Welsh prices this year.');
 await line('Mr Dobbs','Tell him what I told him in March: steam coal is a navy business, and the navy pays.')}
async function showCoal(){
 if(!F('delivered')){await say('Hallam’s letter first. One errand at a time.');return}
 if(F('valued')){await line('Mr Dobbs','Put that away before someone else sees it.');return}
 await speak('Mr Dobbs. What would you make of this?');
 await line('Mr Dobbs','Hm.');await line('Mr Dobbs','Where’d you get this?');
 const c=await choose(['A sample from a client in Kent.','A lump off a barge at Wapping.','It was a dead man’s. I’m sending his things home.']);
 await line('Mr Dobbs',['Kent! And I’m the Archbishop of Canterbury.','Then that bargeman’s a long way from home.','Then he died knowing something.'][c]);
 await line('Mr Dobbs','Look at the fracture. Bright as a new shilling, and it doesn’t dirty your fingers. Hard as glass.');
 await line('Mr Dobbs','That’s Welsh steam coal, Mr Crane, and good of its kind. Burns hot, and hardly any smoke.');
 await line('Mr Dobbs','The Admiralty takes all it can get. A warship can’t hide behind its own smoke, and the best Welsh raises steam faster than anything from Newcastle.');
 await line('Mr Dobbs','If you know where there’s a seam of that, you’re either a rich man or a dead one.');
 await line('Mr Dobbs','See the long fellow by the pillar? Septimus Vane. Taff and Rhondda Coal Company. Buying leases up every valley in Glamorgan.');
 await line('Mr Dobbs','He’d pay you for that lump. Then he’d make sure nobody paid you for anything again.');
 flag('valued');addLedger('vane');await speak('Rich man, then.')}
async function talkVane(){
 if(!F('admitted')){await say('I can’t get to him from here.');return}
 if(F('vaneMet')){await line('Septimus Vane','Still here, Mr Crane? My offer stands. Information pays.');return}
 flag('vaneMet');addLedger('vane');
 await line('Septimus Vane','You’re Hallam’s man. The draughtsman.');await speak('Elias Crane.');
 await line('Septimus Vane','Hallam’s been asking about Welsh prices. Is he thinking of Glamorgan, Mr Crane?');
 const c=await choose(['Mr Hallam doesn’t confide in draughtsmen.','Surrey, I believe.']);
 await line('Septimus Vane',c?'Surrey. Of course.':'No. I don’t suppose he does.');
 await line('Septimus Vane','Every valley in Glamorgan will have a pit in ten years. I mean to own the best of them.');
 await line('Septimus Vane','If you ever hear of one before I do, come and see me. I pay well for information. Once.');
 await speak('Once. Yes. I imagine you do.')}

async function talkHatch(){
 addLedger('hatch');
 if(F('ordered')&&!has('forged')){await collectLetter();return}
 await line('Mrs Hatch','Pledging or redeeming, dear?');
 const o=[];
 if(has('watch'))o.push(['Pledging. My watch.',pledge]);
 if(has('bticket'))o.push(['Redeeming. Mr Bevan’s theodolite.',redeemTheo]);
 if(has('osletter')&&!F('ordered'))o.push(['Neither. I need a letter written.',askLetter]);
 if(!o.length){await line('Mrs Hatch','Twelve months and seven days, Mr '+(F('smith')?'Smith':'Crane')+'. Then it’s mine to sell.');return}
 const c=await choose([...o.map(x=>x[0]),'Nothing, yet.']);if(o[c])await o[c][1]()}
/* the letter of authority: Mrs Hatch's lodger, a law-writer, copies the Colonel's hand onto the blank leaf of the real letter */
async function askLetter(){
 await speak('A letter, in this gentleman’s hand. Saying I may go where I like in Glamorgan with a theodolite.');
 await line('Mrs Hatch','Government paper. Hm.');await sleep(400);
 await line('Mrs Hatch','I don’t do letters, dear. But Mr Ellis upstairs does. Law-writer. Copies wills for Chancery Lane all day, and whatever’s wanted all night.');
 addLedger('ellis');
 await line('Mrs Hatch','He’ll want the real one to work from. The second leaf is blank, see, with the Crown pressed in the corner. He can’t forge the Crown, but he doesn’t have to.');
 await line('Mrs Hatch','Seven and six. Or I’ll take a ticket off you, if you’ve one worth having.');
 const o=[];
 /* cash only if it still leaves the fare and the theodolite paid for */
 const need=90+(has('rticket')?0:270)+(has('theodolite')?0:126);
 if(G.money>=need)o.push(['Seven and six.',async()=>{spend(90)}]);
 if(has('pawnticket'))o.push(['Take the ticket for my father’s watch.',async()=>{drop('pawnticket');flag('watchGone');await line('Mrs Hatch','Your father’s watch, for a colonel’s hand. Well. It didn’t go anyway.');await say('No. It didn’t.')}]);
 if(!o.length){await line('Mrs Hatch','Seven and six, dear, or something on my shelf to show for it. Come back when you’ve one or the other.');return}
 const c=await choose([...o.map(x=>x[0]),'Not yet.']);if(!o[c])return;await o[c][1]();
 await speak('The bearer, Mr E. Crane, Civil Assistant, is authorised to enter upon lands in the County of Glamorgan, for the purposes of the Survey.');
 await line('Mrs Hatch','I’ll take it up to him. He’s a slow, careful man, Mr Ellis. Come back in an hour.');
 drop('osletter');flag('ordered');addSecret('forgery')}
async function collectLetter(){
 if(!F('forgeReady')){await line('Mrs Hatch','Not yet, dear. He’s still on the capital letters. Come back in an hour.');return}
 await line('Mrs Hatch','There. Written on the blank leaf and cut off clean. The old half went in his fire, so there’s nothing to come back to you.');give('forged');
 await say('“H. James, Colonel R.E., Director-General.” Better than the real one. The Crown sits in the corner where Southampton put it.');
 await say('Any farmer in Wales would open his gate to that.')}
async function pledge(){
 addLedger('hatch');
 await line('Mrs Hatch','Let’s see it, then.');await line('Mrs Hatch','Silver hunter. London hallmark. Doesn’t go.');await line('Mrs Hatch','Thirty-five shillings.');
 const c=await choose(['Done.','A London hallmark, as you say. Fifty.']);
 let d=420;if(c===1){await line('Mrs Hatch','Fifty! Forty-five, and you’re robbing a widow.');d=540}
 await line('Mrs Hatch','Name?');
 const n=await choose(['Elias Crane.','John Smith.']);
 if(n===0)await line('Mrs Hatch','An honest one. We don’t get many.');else{flag('smith');await line('Mrs Hatch','Another Mr Smith. Grand family, the Smiths. Half of Holborn.')}
 drop('watch');earn(d);give('pawnticket');flag('pawned');
 await line('Mrs Hatch',`${lsd(d)}, and your ticket. Twelve months and seven days to redeem.`);
 await say('Twenty past four, Father. You’d want it to buy something useful.')}

async function redeemTheo(){
 addLedger('hatch');
 await line('Mrs Hatch','Bevan. The surveyor. Brought it in May, wrapped in his coat against the rain. Said he’d be back for it when his ship came in.');
 await speak('He died on Tuesday.');
 await line('Mrs Hatch','Did he. I’m sorry for it. He was a gentleman about the interest.');
 await line('Mrs Hatch','Still, the ticket’s the ticket, dear. Whoever holds it redeems it. Ten shillings, and sixpence interest.');
 if(G.money<126){await say('Ten and six. I have '+lsd(G.money)+'.');await say(has('watch')?'There’s Father’s watch. It doesn’t go, but Mrs Hatch doesn’t mind that.':'I need more money than I have.');return}
 spend(126);drop('bticket');give('theodolite');flag('redeemed');addSecret('ticket');
 await line('Mrs Hatch','Mind the legs on the door.');
 await say('Mahogany, with J.B. cut in the lid. Someone has kept the brass oiled. He was always going to come back for it.')}

async function buyTicket(){
 if(has('rticket')){await line('Booking clerk','You’ve your ticket, sir. Platform one, the nine o’clock.');return}
 await line('Booking clerk','Where to, sir?');await speak('Cardiff.');await line('Booking clerk','The night mail goes round by Gloucester, sir. No bridge over the Severn. Six hours, near enough.');
 await line('Booking clerk','Night mail, nine o’clock. First class one pound thirteen; second, one pound two and six. Third is the Parliamentary, a penny a mile, half past six tomorrow morning.');
 if(G.money<270){await say('One pound two and six. I have '+lsd(G.money)+'.');await say('And by tomorrow, Grice will be looking for the Colonel’s letter.');await say('I need money tonight. There’s Mrs Hatch, in Leather Lane.');return}
 const c=await choose(['Second class, single.','First class.']);
 if(c===1){await speak('And arrive a gentleman with nothing left? Second, please.')}
 spend(270);give('rticket');await line('Booking clerk','Second single, Cardiff. Change at Cardiff for the Taff Vale.')}
async function sendBox(){
 await line('Parcels clerk','Where to, sir?');await speak('Mrs Gwen Rees, Pen-y-graig, Cwm Du. Taff Vale Railway, Pontypridd station, to be collected.');
 await line('Parcels clerk','Contents?');await speak('Personal effects. A dead man’s spectacles and his last letter.');
 await line('Parcels clerk','Carriage paid, or carriage forward?');
 const opts=G.money>=20?['Paid. One and eightpence.','Forward. She can pay at the other end.']:['Forward. She can pay at the other end.'];
 const c=await choose(opts);
 if(opts.length===2&&c===0){spend(20);await line('Parcels clerk','Very decent of you, sir.')}else await line('Parcels clerk','Forward it is.');
 drop('box');flag('sent');await line('Parcels clerk','It’ll go down on the nine o’clock, sir. Same as you, if you’re quick.')}
async function readPapers(){
 await say('The Times. The Suez Canal opens in November, and the French are delighted with themselves.');
 await say('The Debtors Act: from New Year, no more prison for debt. A man can owe what he likes.');
 await say('And a notice. “The Lords of the Admiralty invite tenders for the supply of Welsh steam coal.”');
 if(!F('valued'))await say('Welsh steam coal. Someone at the Exchange will know what that’s worth.')}
async function talkGuard(){await line('Guard','Down mail for Reading, Swindon, Gloucester and South Wales! Change at Cardiff for the Taff Vale!');if(!has('rticket'))await line('Guard','Ticket first, sir. Booking office is behind you.')}
async function board(){
 const miss=[];
 if(!F('rubbed'))miss.push('I don’t even know where in Wales I’m going. Whatever Bevan found, it was on those torn pages.');
 else if(!F('valued'))miss.push('And I don’t know what his coal is worth. Somebody on the Coal Exchange would know at a glance.');
 if(F('rubbed')&&!has('forged'))miss.push('A stranger on a Welsh hillside with a theodolite gets asked questions. I need an answer on paper.');
 if(F('rubbed')&&!has('theodolite'))miss.push(has('bticket')?'I’ve nothing to survey with. Bevan’s theodolite is still on Mrs Hatch’s shelf, and his ticket is in my pocket.':'I’ve nothing to survey with.');
 if(!F('sent'))miss.push(has('box')?'Bevan’s box is still under my arm.':'And Bevan’s things are still on his desk, waiting to be boxed.');
 if(!F('delivered'))miss.push('Hallam’s letter to Dobbs is still in my pocket. Hallam would have the police after me by Thursday.');
 if(!has('rticket'))miss.push('And I haven’t a ticket.');
 if(miss.length){await line('Guard','Board if you’re boarding, sir.');for(const m of miss.slice(0,3))await say(m);return}
 await line('Guard','Ticket, sir? Second class, Cardiff. In you get.');
 await say('Gwen Rees. Pen-y-graig. Cae’r Glo.');await say('Six feet of steam coal, and nobody alive knows it but me.');
 crane.hidden=true;flag('boarded');audio.whistle();
 await sleep(3800);await finale()}

 combine:(a,b)=>{run(()=>combine(a,b));return'ok'}};
})();
</script>
