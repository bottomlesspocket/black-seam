<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Seam Act 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500&display=swap">
<style>
:root{--ink:#0b0705;--gold:#e9b86a;--cream:#f3e3c4;--muted:rgba(243,227,196,.62);--glass:rgba(20,12,8,.5);--line:rgba(233,184,106,.22)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--cream);cursor:none}
#stage{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.chapter{position:absolute;left:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);text-shadow:0 1px 14px rgba(0,0,0,.7)}
.chapter small{display:block;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:.85}
.chapter h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(26px,3.6vw,42px);line-height:1.05;margin-top:6px}
.chapter p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(15px,1.5vw,18px);color:var(--muted);margin-top:4px}
.tools{position:absolute;right:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);display:flex;gap:10px;pointer-events:auto;z-index:8}
.tool{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--cream);transition:transform .25s,border-color .25s,background .25s;cursor:none;padding:0}
.tool:hover,.tool.active{transform:translateY(-2px);border-color:rgba(233,184,106,.7);background:rgba(40,24,14,.7)}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#2a1709;font-size:10px;font-weight:500;display:grid;place-items:center;padding:0 5px}
.tool .badge:empty{display:none}
.tool.bump{animation:bump .6s}
.tool .tip{position:absolute;top:56px;right:0;white-space:nowrap;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--glass);border:1px solid var(--line);opacity:0;transform:translateY(-4px);transition:.2s;pointer-events:none}
@media (hover:hover){.tool:hover .tip{opacity:1;transform:none}}
.tool.snd .off{display:none}.tool.snd.muted .on{display:none}.tool.snd.muted .off{display:block}.tool.snd.muted{color:var(--muted)}
.tool.look{display:none}
.purse{position:absolute;right:clamp(16px,4vw,48px);top:calc(clamp(16px,4vh,40px) + 58px);font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:right;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.purse b{color:var(--cream);font-weight:500;font-variant-numeric:tabular-nums}
.sub{position:absolute;left:50%;bottom:clamp(20px,6vh,56px);transform:translateX(-50%);width:min(780px,calc(100% - 32px));text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
.sub.on{opacity:1}
.sub .who{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;text-shadow:0 1px 8px #000}
.sub .line{font-family:"Cormorant Garamond",serif;font-size:clamp(20px,2.4vw,28px);line-height:1.3;text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 2px #000}
.choices{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:14px;pointer-events:auto}
.choices button,.btn{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid rgba(233,184,106,.45);background:rgba(20,12,8,.72);backdrop-filter:blur(8px);color:var(--cream);cursor:none;transition:background .15s,color .15s,transform .15s;max-width:100%}
.choices button:hover,.choices button:focus-visible,.btn:hover,.btn:focus-visible{background:var(--gold);color:#2a1709;outline:none}
.hs{position:absolute;pointer-events:auto;cursor:none;border-radius:12px}
.exit{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:rgba(24,10,8,.62);border:1.5px solid rgba(220,70,56,.9);box-shadow:0 0 0 4px rgba(220,70,56,.15),0 6px 18px rgba(0,0,0,.4);pointer-events:auto;cursor:none;padding:0;z-index:4;transition:transform .2s,background .2s;animation:exitPulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.exit:hover{transform:scale(1.12);background:rgba(160,36,28,.85)}
.exit svg{width:24px;height:24px;fill:none;stroke:#ff6a58;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.exit:hover svg{stroke:#fff1e8}
.exit.right svg{transform:rotate(180deg)}.exit.up svg{transform:rotate(90deg)}.exit.down svg{transform:rotate(-90deg)}
@keyframes exitPulse{50%{box-shadow:0 0 0 9px rgba(220,70,56,.04),0 6px 18px rgba(0,0,0,.4)}}
.hs::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--cream);opacity:0;transition:opacity .4s}
body.reveal .hs::after{opacity:.6;animation:ping 2.2s infinite}
body.busy .hs{pointer-events:none}
.label{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .2s;text-align:center;white-space:nowrap;z-index:5}
.label.on{opacity:1}
.label .name{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 3px #000}
.label .verbs{margin-top:8px;display:none;gap:6px;justify-content:center;flex-wrap:wrap}
.label.open{pointer-events:auto}.label.open .verbs{display:flex}
.label .verbs button{font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid rgba(233,184,106,.45);backdrop-filter:blur(8px);color:var(--cream);cursor:none}
.label .verbs button:hover{color:#2a1709;background:var(--gold)}
#cursor{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border:1px solid rgba(243,227,196,.75);border-radius:50%;pointer-events:none;transition:width .2s,height .2s,margin .2s,border-color .2s,background .2s;z-index:40}
#cursor::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:var(--cream)}
#cursor.hot{width:44px;height:44px;margin:-22px 0 0 -22px;border-color:var(--gold);background:rgba(233,184,106,.08)}
#holding{position:fixed;left:0;top:0;pointer-events:none;z-index:39;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--gold);color:#2a1709;white-space:nowrap;display:none;transform:translate(22px,18px)}
#holding.touch{left:50%;top:auto;bottom:calc(clamp(20px,6vh,56px) + 90px);transform:translateX(-50%);pointer-events:auto;font-size:13px;padding:8px 14px}
body.holding #holding{display:block}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:rgba(243,227,196,.4);white-space:nowrap}
.panel{position:absolute;right:clamp(16px,4vw,48px);top:calc(clamp(16px,4vh,40px) + 84px);width:min(390px,calc(100% - 32px));max-height:calc(100% - 210px);overflow:auto;background:rgba(18,11,7,.88);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:18px;pointer-events:auto;opacity:0;transform:translateY(-6px);transition:opacity .22s,transform .22s,visibility .22s;visibility:hidden;z-index:6}
.panel.on{opacity:1;transform:none;visibility:visible}
.panel h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:26px;margin-bottom:4px}
.panel .sub2{font-size:12px;color:var(--muted);margin-bottom:14px}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--cream);font:inherit;font-size:11px;line-height:1.25;text-align:center;cursor:none;min-width:0}
.item:hover{border-color:rgba(233,184,106,.6)}
.item.sel{border-color:var(--gold);background:rgba(233,184,106,.14)}
.item svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.desc{margin-top:14px;font-family:"Cormorant Garamond",serif;font-size:19px;line-height:1.35}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:12px}
.list .row b{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:500;display:block}
.list .row span{font-size:13px;color:var(--muted);line-height:1.45}
.goal{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px;line-height:1.4}
.goal i{width:13px;height:13px;border:1px solid var(--gold);border-radius:3px;margin-top:3px}
.goal.done{color:var(--muted)}.goal.done i{background:var(--gold)}
.empty{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:18px;color:var(--muted)}
.toast{position:absolute;left:50%;top:clamp(84px,12vh,120px);transform:translate(-50%,-8px);background:rgba(18,11,7,.86);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;z-index:7;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--gold);font-weight:500}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,5,3,.9);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;padding:24px 16px;cursor:auto}
.overlay.on{opacity:1;visibility:visible}
.overlay button{cursor:pointer}
.card{text-align:center;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:14px}
.card small{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.card h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,7vw,72px);line-height:1}
.card p{font-family:"Cormorant Garamond",serif;font-size:clamp(18px,2.2vw,22px);line-height:1.45;color:var(--muted)}
.card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.card a{color:var(--gold)}
#fade{position:fixed;inset:0;background:#050302;opacity:0;pointer-events:none;transition:opacity .7s;z-index:25;display:grid;place-items:center}
#fade.on{opacity:1;pointer-events:auto}
#fade p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(20px,2.6vw,28px);color:var(--cream);opacity:.85;text-align:center;padding:0 24px;max-width:700px}
.map{width:min(900px,100%);display:flex;flex-direction:column;gap:12px}
.map h2{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:32px;text-align:center}
.mapbox{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#1b130d}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-13px);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--cream);font:inherit;padding:6px}
.pin i{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(233,184,106,.25)}
.pin span{font-family:"Cormorant Garamond",serif;font-size:clamp(14px,2vw,19px);white-space:nowrap;text-shadow:0 1px 6px #000}
.pin em{pointer-events:none;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.pin.here i{background:var(--cream)}
.pin:hover span,.pin:focus-visible span{color:var(--gold)}
.rub{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(640px,100%)}
.rub canvas{position:relative;width:100%;height:auto;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:none;cursor:crosshair}
.rub p{font-family:"Cormorant Garamond",serif;font-size:19px;color:var(--muted);text-align:center}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(243,227,196,.45)}80%,100%{box-shadow:0 0 0 14px rgba(243,227,196,0)}}
@keyframes bump{30%{transform:scale(1.18);border-color:var(--gold)}}
@media (pointer:coarse){.tool.look{display:grid}.tool{width:42px;height:42px}.label .verbs button{font-size:14px;padding:10px 16px}body.reveal .hs::after{opacity:.9}.hs::after{opacity:.35}}
@media (hover:none){body{cursor:auto}#cursor{display:none}}
@media (max-width:640px){.purse{top:calc(clamp(16px,4vh,40px) + 54px)}.tools{gap:6px}.chapter{top:calc(clamp(16px,4vh,40px) + 74px)}.chapter h1{font-size:24px}.chapter p{font-size:14px}}
@media (max-width:640px){.hint{display:none}.pin em{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 <canvas id="c"></canvas>
 <div class="hud" id="hud">
  <div class="chapter"><small>Act 1 · The survey</small><h1 id="chH">Cwm Du</h1><p id="chP">Glamorgan · September 1869</p></div>

   <button class="tool" data-tab="ledger" aria-label="Ledger"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg><span class="badge" id="bLedger"></span><span class="tip">Ledger · people</span></button>

 </div>
</div>
<div id="holding"></div>

<div class="overlay" id="ov"></div>

<script>
(()=>{
'use strict';
const VW=1600,VH=900;
const cv=document.getElementById('c'),main=cv.getContext('2d');let ctx=main;
const hud=document.getElementById('hud'),cur=document.getElementById('cursor'),stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,S,OX,OY,pan=0,maxPan=0;
const clampPan=p=>Math.max(-maxPan,Math.min(maxPan,p));
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.max(W/VW,Math.min(H/VH,W*1.9/VW));maxPan=Math.max(0,(VW*S-W)/2);pan=clampPan(pan);OX=(W-VW*S)/2+pan;OY=(H-VH*S)/2}
addEventListener('resize',resize);resize();
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P=f=>{const p=new Path2D();f(p);return p};
function rimFill(path,dark,rim,dx,dy){ctx.save();ctx.clip(path);ctx.fillStyle=rim;ctx.fill(path);ctx.translate(dx,dy);ctx.fillStyle=dark;ctx.fill(path);ctx.restore()}
const lg=(x0,y0,x1,y1,st)=>{const g=ctx.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g};
function glow(x,y,r,c,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore()}
let mx=0,my=0,tx=0,ty=0,mouse=!matchMedia('(pointer:coarse)').matches;
const off=d=>({x:-mx*d*30,y:0});
const grain=document.createElement('canvas');grain.width=grain.height=200;
{const g=grain.getContext('2d'),im=g.createImageData(200,200),r=rng(7);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}
const grainPat=main.createPattern(grain,'repeat');

/* ================= characters ================= */
const CR={
 legs:[P(p=>{p.moveTo(-16,-52);p.lineTo(-6,-52);p.lineTo(-7,-11);p.lineTo(-17,-11);p.closePath();p.moveTo(-18,-13);p.lineTo(-7,-13);p.quadraticCurveTo(-1,-7,3,-3);p.lineTo(3,0);p.lineTo(-19,0);p.closePath()}),
       P(p=>{p.moveTo(4,-52);p.lineTo(14,-52);p.lineTo(18,-11);p.lineTo(8,-11);p.closePath();p.moveTo(7,-13);p.lineTo(18,-13);p.quadraticCurveTo(24,-7,29,-3);p.lineTo(29,0);p.lineTo(6,0);p.closePath()})],
 coat:P(p=>{p.moveTo(-11,-204);p.quadraticCurveTo(-25,-199,-30,-187);p.quadraticCurveTo(-33,-160,-30,-128);p.quadraticCurveTo(-34,-88,-40,-48);p.quadraticCurveTo(-29,-42,-19,-45);p.lineTo(-12,-62);p.lineTo(-6,-44);p.quadraticCurveTo(15,-41,38,-47);p.quadraticCurveTo(34,-86,31,-124);p.quadraticCurveTo(33,-168,26,-188);p.quadraticCurveTo(17,-198,8,-200);p.closePath();
  p.moveTo(-15,-208);p.lineTo(-7,-195);p.lineTo(9,-195);p.lineTo(12,-203);p.quadraticCurveTo(0,-199,-15,-208);p.closePath()}),
 armR:P(p=>{p.moveTo(22,-185);p.quadraticCurveTo(37,-160,41,-118);p.lineTo(43,-110);p.lineTo(33,-107);p.lineTo(31,-118);p.quadraticCurveTo(28,-150,16,-172);p.closePath()}),
 hands:P(p=>{p.ellipse(38,-104,4.6,5,0,0,Math.PI*2);p.moveTo(-26,-104);p.ellipse(-30,-104,4,5.6,.2,0,Math.PI*2)}),
 head:P(p=>{p.moveTo(-11,-227);p.quadraticCurveTo(-16,-214,-12,-204);p.lineTo(-9,-197);p.lineTo(8,-196);p.quadraticCurveTo(13,-199,14,-203);p.lineTo(17,-205);p.lineTo(15.5,-208);p.lineTo(19,-211);p.lineTo(15.5,-217);p.quadraticCurveTo(14.5,-225,10,-228);p.closePath()}),
 bowler:P(p=>{p.moveTo(-14,-229);p.quadraticCurveTo(-15,-250,1,-251);p.quadraticCurveTo(16,-250,16,-229);p.closePath();p.moveTo(-21,-227);p.quadraticCurveTo(-17,-231.5,-8,-230.5);p.lineTo(10,-230.5);p.quadraticCurveTo(20,-231.5,23,-227.5);p.quadraticCurveTo(17,-224,0,-225);p.quadraticCurveTo(-16,-224,-21,-227);p.closePath()})};

const SAVE='blackseam-act1-v1';
/* whatever Crane had left at Paddington comes with him */
function prologueMoney(){try{const g=JSON.parse(localStorage.getItem('blackseam-prologue-v2'));if(g&&typeof g.money==='number'&&g.money>=0)return g.money}catch(_){}return 21}
const fresh=()=>({scene:'halt',inv:['theodolite','forged','notebook','coal'],flags:{},money:prologueMoney(),day:1,night:false,ledger:['bevan','gwen','vane'],secrets:['seam'],seen:{}});
let G=fresh();
const has=i=>G.inv.includes(i),F=f=>!!G.flags[f];
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(_){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s&&s.scene&&!s.flags.done)return s}catch(_){}return null}
function flag(f,v=true){G.flags[f]=v;save();ui()}
function give(i){if(!has(i)){G.inv.push(i);toast(`Satchel · <b>${ITEMS[i].name}</b>`);bump('satchel')}save();ui()}
function drop(i){G.inv=G.inv.filter(x=>x!==i);if(sel===i)setSel(null);save();ui()}
function addLedger(id){if(!G.ledger.includes(id)){G.ledger.push(id);toast(`Ledger · <b>${LEDGER[id][0]}</b>`);bump('ledger');G.seen.ledger=false}save();ui()}
function addSecret(id){if(!G.secrets.includes(id)){G.secrets.push(id);toast(`Secret · <b>${SECRETS[id][0]}</b>`);bump('secrets');G.seen.secrets=false}save();ui()}
function spend(d){G.money-=d;save();ui()}
function earn(d){G.money+=d;save();ui()}
const lsd=d=>{const l=Math.floor(d/240),s=Math.floor(d%240/12),p=d%12;const a=[];if(l)a.push('£'+l);if(s||l)a.push(s+'s');if(p||!a.length)a.push(p+'d');return a.join(' ')};
/* calendar: day 1 is Saturday; Sunday is day%7===2 */
const DAYS=['Friday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'];
const dayName=()=>DAYS[G.day%7];
const isSunday=()=>G.day%7===2;
const night=()=>G.night;
/* Sunday morning: the whole valley is in chapel until the service ends */
const churchTime=()=>isSunday()&&!G.night&&!F('svc'+G.day);
const proofs=()=>(F('burnt')?1:0)+(F('dip')?1:0)+(F('six')?1:0);

}

async function listenSettle(){
 await line('Old Evan','…and Morgan says the widow’s pool floods his bottom field every winter, and she says it was there before his grandfather was.');
 await line('Old Ianto','Haven’t spoken in two years, those two. Over a puddle.');
 {const src=heard('settle');await line('Old Evan',src?`There’s the Englishman. Measuring hedges, ${src==='Pugh'?'Pugh says':'young Will says'}.`:'There’s a stranger. Off the train, by the look of him.')}await speak('Good afternoon.');await line('Old Ianto','Prynhawn da.')}
async function talkPugh(){
 if(!F('pughMet')){flag('pughMet');addLedger('pugh');if(heard('pugh'))await line('Pugh','You’ll be the gentleman off the 12.15. The stationmaster sent a boy up. Survey, he says.')}
 const o=[];if(!F('room'))o.push('A room, please.');if(has('lamp')&&!F('lampOil'))o.push('Could I buy some lamp oil?');o.push('What’s the news?','Nothing.');
 const c=await choose(o),k=o[c];
 if(k.startsWith('A room')&&F('roomAsked')){await line('Pugh','Still full, sir. Still shearers.');await say('Still a stranger, then. Not for long.')}
 else if(k.startsWith('A room')){await line('Pugh','Full, sir. Sorry, sir. Shearers.');await speak('In September?');await line('Pugh','Late shearers.');
  await say('He isn’t full. He doesn’t know me. A stranger off the train with a brass instrument and no business here is trouble, in a valley like this.');
  await say('A government man, on the other hand, is a guest. Time he saw who I’m supposed to be.');flag('roomAsked')}
 else if(k.startsWith('Could I buy a lantern')){
  await line('Pugh','Lantern and a gill of paraffin, threepence. Out at night measuring, is it?');
  if(G.money<3){await speak('I’m short.');return}
  await say('The stars are part of the Survey too.');spend(3);give('lantern');await line('Pugh','If you say so, sir.')}
 else if(k.startsWith('Could I buy some')){await line('Pugh','That’s a collier’s lamp, sir. Lamp oil, a gill, threepence.');
  if(G.money<3){await speak('I’m short.');return}
  await speak('Survey issue.');spend(3);flag('lampOil');await line('Pugh','If you say so, sir.');await say('Filled, and the wick trimmed. A flame no bigger than a fingernail.')}
 else if(k.startsWith('What')){await line('Pugh','News? Mr Pryce wants six hundred pound for a new roof, Price wants a new plough, and Morgan Tŷ Isaf wants to go to Patagonia. Nobody’s got a farthing.');await line('Pugh','And now there’s you.')}}
async function showPugh(){
 if(F('room')){await line('Pugh','I’ve seen it, sir. Very nice. Still the front room.');return}
 await speak('Mr Pugh. I’m not a traveller. I’m here on government business.');await sleep(300);

async function enterKitchen(){
 if(G.night)return say('The house is dark. Gwen’s asleep, and I should be too.');
 if(!F('metGwen'))return say('I can hardly walk into a stranger’s kitchen. I should speak to her first.');
 if(churchTime()&&!(F('errand')&&!has('hymnbook')))return say('Nobody home. She’s up at Bethel with everyone else.');
 if(churchTime()){await goScene('kitchen','The door’s on the latch, as she said. I let myself in.');return}
 if(F('gwenCry')){await goScene('kitchen','The door’s ajar. I can hear her crying.');return}
 await line('Gwen Rees','Come in, Mr Crane. Mind the hens, and wipe your boots.');await goScene('kitchen')}
async function leaveKitchen(){
 if(F('gwenCry'))await say('I let myself out. She doesn’t look up.')
 await goScene('farm')}
async function readLetter(){
 const home=!G.night&&!churchTime();
 if(F('letter'))return say('“…something to show you on our own land that will—” She read it as a father’s promise.');
 flag('letter');
 if(home)await line('Gwen Rees','That’s his letter. The one he never finished. Read it, if you like. You knew him.');
 await say('I need to know if he wrote anything about the coal.');
 await say('“My dear Gwen, I shall be home to Pen-y-graig for the harvest, and I have something to show you on our own land that will—” It stops there.');
 await say('Something on their own land. He meant the coal, and he died before he could write the word.');
 await say('She’s read this a hundred times, and she thinks he meant himself, coming home. She doesn’t know.')}
async function lookLamp(){
 await say('A miner’s safety lamp. Brass, with a tube of fine wire mesh round where the flame goes. “J.B.” scratched into the base.');
 if(!F('lampSeen')){flag('lampSeen');
  await say('The mesh keeps the flame small and shut in, so it can’t set light to gas underground. It also means the glow is tiny.');
  await say('With a lamp like that I could work on the coal bank at night, and nobody on the hill would see a glimmer.')}}
async function takeLamp(){
 const home=!G.night&&!churchTime();
 if(home&&!F('gwenCry')){await line('Gwen Rees','Leave that be, Mr Crane. That was Dada’s.');if(!F('lampSeen'))await lookLamp();return}
 if(!home){await say('Take it while she’s at chapel? She’d see it gone the minute she got home, and know it was the man she sent for her hymn book.');return}
 give('lamp');flag('stoleLamp');addSecret('lamp');
 await say('Under my coat. She never looks up.');
 await say('Her father’s lamp, for her father’s coal. Mr Dobbs would call it business.')}
async function talkGwenKitchen(){
 if(F('gwenCry')){await line('Gwen Rees','Please, Mr Crane. Just… go. I’m sorry.');return}
 if(F('stoleLamp')&&!F('lampBlame')){flag('lampBlame');await line('Gwen Rees','Dada’s lamp has gone from the dresser. Morgan’s been in my kitchen, I know it.');await say('…');return}
 const o=[];
 if(F('lampSeen')&&!F('lampAsked')&&!has('lamp'))o.push('About the lamp on the dresser.');
 if(F('lampAsked')&&!has('lamp'))o.push('About your father.');
 o.push('Nothing.');
 const c=await choose(o),k=o[c];
 if(k.startsWith('About the lamp')){flag('lampAsked');
  await line('Gwen Rees','Dada’s first lamp. He bought it with his first wages at the Dinas pit, the year before he went to London.');
  await speak('Could I borrow it? For the Survey. Some of our work is done at night.');
  await line('Gwen Rees','No, Mr Crane. It’s the only thing of his I have from before he went to London.');
  await say('She won’t part with it. Not while she’s watching, anyway.')}
 else if(k.startsWith('About your')){
  await say('There’s one thing that would make her look away from that dresser.');
  const c2=await choose(['Tell her how he died.','No. Leave her be.']);
  if(c2===1)return say('Not today.');
  await speak('You asked what he did up there, Mrs Rees. I was there the day he died.');
  await speak('He was at his desk, writing. He stopped between one sentence and the next, and he never started again.');
  await speak('The letter on your dresser. That was the one he was writing.');
  await line('Gwen Rees','To me. He was writing to me.');
  flag('gwenCry');flag('cruel');
  await line('Gwen Rees','Thirty years, and he was writing to me…');
  await say('She turns away and puts her hands over her face.');
  await say('Now. While she can’t see the dresser.')}}
async function takeHymnBook(){
 give('hymnbook');await say('“Llyfr Hymnau.” Her name inside, and her father’s, crossed out.');await say('Now back to Bethel, before the last hymn.')}

async function lookPool(){
 if(!F('tithe')){await say('A stone sheep-wash. Bevan’s notebook says “by the sheep-wash”, but there are three on this brook alone. I need to know which field was Cae’r Glo.');return}
 if(F('drained'))return say('Mud, and an angry widow.');
 if(F('poolPlan'))return say('Bevan’s outcrop, under four feet of Gwen’s water. Lift the sluice boards at night and it drains down the brook.');
 flag('poolPlan');await say('Gwen’s sheep-wash: a pool dammed in the brook, where the sheep get washed before shearing. Bevan’s outcrop, the place where the coal shows at the surface, is “in the stream bank”. Under four feet of water.');
 await say('I could ask Gwen to drain it. Then she’d ask why the Survey wants to look at mud, and she’s Bevan’s daughter. She’d work it out by teatime.');
 await say('The sluice, then. Lift the boards out and the pool runs away down the brook. At night, with nobody watching.');flag('needBar')}
async function forceSluice(){
 if(F('drained'))return say('It’s done.');
 if(!F('tithe')){await say('Smash a farmer’s sluice on a hunch? I need to know this is the right field.');return}
 if(!has('crowbar')){flag('needBar');await say('With my hands? The boards are swollen tight in the slot. I need an iron bar to lever them out.');await say('Dai the smith will have one.');return}
 if(!G.night){await say('In daylight? Gwen’s kitchen window looks straight down this meadow.');return}
 await say('Bar in the slot. Lean.');await sleep(400);await say('The top board goes. Then the rest, all at once.');
 flag('drained');G.flags.drainDay=G.day;await say('Listen to it. Like a bath emptying. By morning there’ll be nothing in there but mud.');
 await say('And the bank.');await say('Gwen will find it in the morning. She’ll think it was boys. Or Morgan.')}
async function lookBank(){
 if(has('sample')||F('six'))return say('The coal in the bank, between the sandstone and the clay, where the water used to be.');
 await say('Where the water used to be, the stream has cut straight through the ground, like a knife through a cake.');
 await say('Brown sandstone on top. Pale grey clay at the bottom. And between them, a thick black band of coal. Bevan’s outcrop.');
 await say('He must have seen it as a boy, the odd summer the pool was emptied for cleaning. And years later, once he was a surveyor, he understood what it was.')}
/* the bank can only be worked while the whole valley is in chapel */
async function bankWatched(){
 if(churchTime()){await say('In broad daylight? Even with the whole valley at chapel, this bank is in plain view of the road.');await say('Digging and measuring take time. That’s night work.');return true}
 if(!G.night){await say('Not in daylight. Gwen’s kitchen window looks straight down on this pool, and after last night she’ll be watching it.');await say('If she sees me digging in her drained sheep-wash, she’ll know who opened the sluice. This is night work.');return true}
 if(G.flags.drainDay===G.day){await say('It’s still draining. By tomorrow night the bank will be clear.');return true}
 if(!has('lamp')){await say('In the dark I can’t tell the coal from the mud. And a lantern would be seen from every farm on the hill.');await say(F('lampSeen')?'I need a light nobody can see. Like the old miner’s lamp on Gwen’s dresser.':'I need a light nobody on the hill can see.');return true}

 return false}

async function takeSight(f,what){

  await say('Three angles. That fixes the outcrop on the map, to the yard.');

async function goChapelService(){
 if(F('svcIntro'+G.day))return;flag('svcIntro'+G.day);addLedger('pryce');
 await line('Rev. Owain Pryce','“Gwyn eu byd y rhai addfwyn: canys hwy a etifeddant y ddaear.”');
 await say('“Blessed are the meek, for they shall inherit the earth.” Even I know that one.');
 await say('The earth. Not the minerals, though.');
 await sleep(300);if(F('drained')&&!F('feud')){await say('Gwen, at the harmonium, glaring across the chapel at Morgan’s pew.');await gwenFeud()}
 if(F('dip')){await say('No errands for me today. An hour of Welsh preaching, and I sit through every word of it.');await sleep(300);
  await line('Rev. Owain Pryce','Emyn tri chant a deuddeg.');await say('Gwen plays it badly, and very loud. Nobody minds.');
  flag('svc'+G.day);flag('svcDone');if(proofs()===3)await checkProofs();return}
 if(F('svcDone')){await line('Gwen Rees','Mr Crane. Don’t look at me like that. Yes. The settle. Again.');
  await speak('I’ll go. It’s becoming a habit.');await line('Gwen Rees','You’re a saint, Mr Crane. An English one, but a saint.');
  flag('errand');await say('Another hour with the whole valley in chapel. This time I’ll be ready to use it.');return}
 await line('Gwen Rees','Mr Crane! Duw, I’ve left my hymn book on the settle at home, and I’m to play the last hymn.');
 const c=await choose(['I’ll fetch it.','Can’t you play from memory?']);
 if(c===1)await line('Gwen Rees','Not the Welsh words to “Hyfrydol”, I can’t. Please, Mr Crane.');
 await speak('I’ll go. I’m no use to the singing.');
 await line('Gwen Rees','The door’s on the latch. Quick now. Mr Pryce preaches for an hour, but not for ever.');flag('errand');
 await say('An hour. With every soul in the valley in this chapel.')}
async function whisperGwen(){

async function returnHymn(){

 if(!F('dip'))await say('An hour with the whole valley in chapel, and I wasn’t ready to use it. Next Sunday, then.');
 drop('hymnbook');await line('Gwen Rees','Diolch. You’re a good man, Mr Crane.');
 if(!F('hymnName')){flag('hymnName');await line('Gwen Rees','You saw his name, crossed out. I did that the year he went to London. I was eight.')}
 await say('…');await sleep(400);await line('Rev. Owain Pryce','Emyn tri chant a deuddeg.');
 await say('Hymn three hundred and twelve. Gwen plays it badly, and very loud, exactly as promised.');
 flag('svc'+G.day);flag('svcDone');flag('errand',false);addLedger('gwen');
 await line('Rev. Owain Pryce','Gwen tells me you went all the way to Pen-y-graig for her book. Bethel owes you a kindness, Mr Crane.');

async function talkPryce(){
 if(churchTime()){await say('Not while he’s preaching.');return}
 addLedger('pryce');
 if(!F('prMet')){const src=heard('pryce');flag('prMet');
  if(src)await line('Rev. Owain Pryce',`The Survey man. Croeso. ${src} told me you’d be calling. We are a poor chapel, Mr Crane, but we are not unfriendly.`);
  else{await line('Rev. Owain Pryce','A stranger in Bethel. Croeso.');await speak('Elias Crane, of the Ordnance Survey.');await line('Rev. Owain Pryce','The Survey! We are a poor chapel, Mr Crane, but we are not unfriendly.')}}
 const o=[];if(F('cae')&&!F('tithe'))o.push(F('pryceTest')&&!F('pryceOk')?'About the height of Bethel’s step.':'Where is Cae’r Glo?');o.push('About the building fund.','Nothing.');
 const c=await choose(o),k=o[c];
 if(k.startsWith('Where')){
  if(F('pryceOk')){await line('Rev. Owain Pryce','The vestry is open to you, Mr Crane.');await goScene('vestry');return}
  await speak('For the new map. The Survey records the old field names, and I can’t place that one.');
  await line('Rev. Owain Pryce','Cae’r Glo? An old name. It’ll be on the tithe map, in the vestry.');
  await line('Rev. Owain Pryce','But forgive me, Mr Crane. Two years ago a gentleman came with a letter very like yours. From the government’s tithe office, he said. He copied my map, field by field.');
  await line('Rev. Owain Pryce','He was Lord Tredegar’s agent. By the spring every rent in this valley had gone up by a third.');
  await speak('I have the Colonel’s own letter of authority.');
  await line('Rev. Owain Pryce','So had he. Letters are easily written.');
  await say('More easily than he knows.');
  await line('Rev. Owain Pryce','But the Survey is the Survey. When the Survey’s soldiers came through in ’65, measuring heights, they told me exactly how high Bethel’s front step stands above the sea. I wrote it in the chapel Bible.');
  await line('Rev. Owain Pryce','A Survey man can find that out. A land agent can’t. Tell me the height of my step, and the map is yours.');
  flag('pryceTest');
  await say('I can’t look it up. Nobody in London gave me the Survey’s books.');
  await say('But the Survey’s soldiers leave a bench mark in every village: an arrow cut in stone, at a spot whose height above the sea they know exactly. Find their arrow, measure how much higher his step is, add the two together, and I’ll have his number.')}
 else if(k.startsWith('About the height'))await answerPryce();
 else if(k.startsWith('About')){await line('Rev. Owain Pryce','Six hundred pounds for a roof. The Lord will provide.');await line('Rev. Owain Pryce','He is taking his time.');await say('Six hundred pounds wanted, and a minister who knows what every farm in the valley owes. Worth remembering.')}}

async function answerPryce(){
 if(!F('rise')){await line('Rev. Owain Pryce','Well, Mr Crane? How high is my step?');await speak(F('bm')?'Not yet. I’ve found the Survey’s arrow, but I still need to measure how much higher his step is.':'Not yet. First I need to find the Survey’s arrow in the village.');return}
 const o=['Four hundred and twelve feet.','Eighty-six feet.','Four hundred and ninety-eight feet.','Three hundred and twenty-six feet.','I’ll come back to it.'];
 const c=await choose(o);if(c===4)return;
 await speak(o[c].replace('.',' above the sea.'));
 if(c!==2){flag('pryceWrong');await line('Rev. Owain Pryce',c===0?'That is the Black Lion’s doorstep, Mr Crane. Pugh tells the whole valley. My chapel is up a hill.':c===1?'Eighty-six feet? Then the sea is lapping at the Black Lion.':'Lord Tredegar’s man guessed, too.');await say('Mark plus rise. Add them up, Crane.');return}
 await line('Rev. Owain Pryce','Four hundred and ninety-eight. That is the soldiers’ figure, to the foot.');
 await line('Rev. Owain Pryce','Forgive an old man his suspicions, Mr Crane. Come through. The vestry is open to you.');
 flag('pryceOk');addLedger('pryce');
 await say('He believes me because I can do the one thing a real Survey man can do. Which is a better reason than most.');

async function readBM(){
 flag('bm');
 await say('An arrow cut into the corner stone, with a flat bar over it. A bench mark. The Survey’s soldiers measured exactly how high this spot is above the sea.');
 await say('And somebody has painted it underneath, in black: “412 FT ABOVE THE SEA”. Pugh, by the look of the brush.');
 if(F('pryceTest')&&!F('rise'))await say(has('theodolite')?'Four hundred and twelve feet, here. Now I measure how much higher Bethel’s step is with the theodolite, and add the two together.':'Four hundred and twelve feet, here. Now I need to measure how much higher Bethel’s step is.')}
async function levelUp(){
 if(!F('pryceTest'))return say('A pretty mark. Nobody’s asked me what it says.');

 if(G.night)return say('In the dark? I couldn’t see Bethel’s step, let alone aim at it.');
 await say('Theodolite over the arrow. Aim it up the path at Bethel’s step, read how steeply it rises, and pace out the distance. Do the sums twice, to be sure.');await sleep(400);
 flag('rise');await say('Eighty-six feet. Bethel’s step is eighty-six feet above the Black Lion’s mark.');
 await say('Four hundred and twelve, and eighty-six. That’s Mr Pryce’s answer.')}

/* tithe map of the parish, 1841: fields on a jittered grid, the Nant Du and the valley road as boundaries */
function titheMap(X,Y,W,H,known){
 const r=rng(21),C=6,R=4,TB=26,cw=W/C,rh=(H-TB)/R,ink='rgba(80,52,26,.85)';
 const N=[];for(let i=0;i<=R;i++){N.push([]);for(let j=0;j<=C;j++){const ej=j===0||j===C,ei=i===0||i===R;N[i].push([X+j*cw+(ej?0:(r()-.5)*cw*.4),Y+i*rh+(ei?0:(r()-.5)*rh*.45)])}}

 const common=(i,j)=>i===0&&j>=2;
 const grp=(i,j)=>common(i,j)?'c':(i===3&&j>=4?'v':i+'_'+j);
 const poly=pts=>{ctx.beginPath();ctx.moveTo(...pts[0]);for(const p of pts.slice(1))ctx.lineTo(...p);ctx.closePath()};
 ctx.save();ctx.beginPath();ctx.rect(X,Y,W,H);ctx.clip();
 /* parchment toning */
 const g=ctx.createRadialGradient(X+W/2,Y+H/2,60,X+W/2,Y+H/2,W*.68);g.addColorStop(0,'rgba(150,110,60,0)');g.addColorStop(1,'rgba(150,110,60,.28)');ctx.fillStyle=g;ctx.fillRect(X,Y,W,H);
 /* the common: hachures */
 ctx.strokeStyle='rgba(90,70,40,.35)';ctx.lineWidth=.8;
 for(let k=0;k<60;k++){const x=N[0][2][0]+8+r()*(W-cw*2-24),y=Y+6+r()*(rh-14);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+3,y+5);ctx.stroke()}
 /* Cae'r Glo, once known */
 if(known){poly(cell(2,1));ctx.fillStyle='rgba(120,96,50,.28)';ctx.fill()}
 /* field boundaries, skipping the stream (j=1) and road (i=3), which draw themselves */
 ctx.strokeStyle=ink;ctx.lineWidth=1;
 for(let i=1;i<R;i++)for(let j=0;j<C;j++){if(i===3)continue;if(grp(i-1,j)===grp(i,j))continue;ctx.beginPath();ctx.moveTo(...N[i][j]);ctx.lineTo(...N[i][j+1]);ctx.stroke()}
 for(let i=0;i<R;i++)for(let j=1;j<C;j++){if(j===1)continue;if(grp(i,j-1)===grp(i,j))continue;ctx.beginPath();ctx.moveTo(...N[i][j]);ctx.lineTo(...N[i+1][j]);ctx.stroke()}
 /* smooth line through a run of nodes */
 const smooth=pts=>{ctx.beginPath();ctx.moveTo(...pts[0]);for(let k=1;k<pts.length-1;k++){const m=mid(pts[k],pts[k+1]);ctx.quadraticCurveTo(pts[k][0],pts[k][1],m[0],m[1])}ctx.lineTo(...pts[pts.length-1])};
 /* valley road */
 const road=N[3];smooth(road);ctx.strokeStyle=ink;ctx.lineWidth=7;ctx.stroke();smooth(road);ctx.strokeStyle='#dcb98a';ctx.lineWidth=5;ctx.stroke();
 /* Nant Du */
 const brook=N.map(row=>row[1]);smooth(brook);ctx.strokeStyle='rgba(50,90,130,.85)';ctx.lineWidth=4;ctx.stroke();smooth(brook);ctx.strokeStyle='rgba(150,190,215,.9)';ctx.lineWidth=1.6;ctx.stroke();
 /* sheep-wash on the brook beside 214 */
 const sw=mid(N[2][1],N[3][1]);const swp=[sw[0]+1,sw[1]-8];ctx.fillStyle='rgba(90,140,180,.85)';ctx.beginPath();ctx.ellipse(swp[0],swp[1],5,8,.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=.8;ctx.stroke();
 /* the oak on Tŷ Isaf's boundary */
 const ok=mid(N[2][2],N[3][2]);ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ok[0],ok[1]+4);ctx.lineTo(ok[0],ok[1]-1);ctx.stroke();
 ctx.fillStyle='rgba(70,90,50,.75)';for(const[dx,dy]of[[-3,-3],[3,-3],[0,-6]]){ctx.beginPath();ctx.arc(ok[0]+dx,ok[1]-2+dy,3.2,0,Math.PI*2);ctx.fill()}
 /* buildings in carmine, as the tithe commissioners coloured them */
 const house=(p,w,h,a)=>{ctx.save();ctx.translate(...p);ctx.rotate(a);ctx.fillStyle='#b2413a';ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle=ink;ctx.lineWidth=.8;ctx.strokeRect(-w/2,-h/2,w,h);ctx.restore()};
 const lab=(s,x,y,sz=8)=>{ctx.fillStyle='#3a2a1a';ctx.font=`italic ${sz}px "IM Fell English",Georgia,serif`;ctx.textAlign='center';ctx.fillText(s,x,y)};

 const pyg=at(1,1,4,-6),tyi=at(2,2,6,-4),ffw=at(1,4,0,-6),bet=at(2,4,8,8);
 house(pyg,12,6,-.1);house([pyg[0]+9,pyg[1]+6],6,5,-.1);lab('Pen-y-graig',pyg[0],pyg[1]-7);
 house(tyi,11,6,.15);lab('Tŷ Isaf',tyi[0],tyi[1]-7);

 /* village strung along the road */
 for(let k=0;k<6;k++){const p=[N[3][4][0]+14+k*18,N[3][4][1]+(N[3][6][1]-N[3][4][1])*(k/7)+((k%2)?9:-9)];house(p,8,5,(k%3-1)*.08)}
 lab('Cwm Du',X+cw*5,N[3][5][1]+22,9);
 /* field numbers */
 ctx.fillStyle='#5a3a1e';ctx.font='8px Georgia,serif';ctx.textAlign='center';
 const busy={'1_1':pyg,'2_2':tyi,'1_4':ffw,'2_4':bet};
 for(let i=0;i<R;i++)for(let j=0;j<C;j++){if(common(i,j)||(i===3&&j>4))continue;const k=i+'_'+j;let c=ctr(i,j);if(busy[k])c=[busy[k][0],busy[k][1]+12];if(i===3&&j===4)c=[c[0]-14,c[1]+16];
  if(known&&i===2&&j===1){ctx.fillStyle='#8a2a1a';ctx.font='bold 9px Georgia,serif';ctx.fillText('214',c[0]+4,c[1]+3);ctx.fillStyle='#5a3a1e';ctx.font='8px Georgia,serif';continue}
  ctx.fillText(String(201+i*C+j),c[0]+(j===1?4:0),c[1]+3)}
 if(known){lab('Cae’r Glo',ctr(2,1)[0]+4,ctr(2,1)[1]+14,8);poly(cell(2,1));ctx.strokeStyle='rgba(150,40,26,.8)';ctx.lineWidth=1.6;ctx.setLineDash([3,2]);ctx.stroke();ctx.setLineDash([])}
 lab('Mynydd Cwm Du',X+cw*4,Y+rh*.55,9);
 ctx.save();ctx.translate(N[0][1][0]-12,Y+36);ctx.rotate(1.25);lab('Nant Du',0,0,8);ctx.restore();
 /* north point */
 const nx=X+W-16,ny=Y+rh+12;ctx.fillStyle=ink;ctx.beginPath();ctx.moveTo(nx,ny-12);ctx.lineTo(nx+4,ny+4);ctx.lineTo(nx,ny);ctx.lineTo(nx-4,ny+4);ctx.closePath();ctx.fill();lab('N',nx,ny-14,8);
 /* title band */
 ctx.strokeStyle=ink;ctx.lineWidth=1;for(const dy of[0,3]){ctx.beginPath();ctx.moveTo(X,Y+H-TB+dy);ctx.lineTo(X+W,Y+H-TB+dy);ctx.stroke()}
 ctx.fillStyle='#ece0bc';ctx.fillRect(X,Y+H-TB+4,W,TB-4);
 ctx.restore()}

  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  bed('stream','bandpass',1700,.5,.05);
  const cr=bed('tap','bandpass',520,1.1,.06);{const l=ac.createOscillator();l.frequency.value=.37;const lg=G_(cr.frequency,140);l.connect(lg);l.start()}
  bed('wind','lowpass',420,.6,.07);
  t0=ac.currentTime+.2;next=0;setInterval(tick,25);
  master.gain.linearRampToValueAtTime(muted?0:.85,ac.currentTime+2);scene(want,wantMus);tick();
  document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()})}
 function scene(name,m){want=name;if(m)setMus(m);if(!ac)return;const now=ac.currentTime;for(const k in ambG){const a=ambG[k];a.g.gain.cancelScheduledValues(now);a.g.gain.setValueAtTime(a.g.gain.value,now);a.g.gain.linearRampToValueAtTime(k===name?a.v:0,now+1.5)}}
 function telegraph(){if(!ac)return;let t=ac.currentTime+.05;
  const click=(at,v)=>{const n=ac.createBufferSource();n.buffer=noiseBuf;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=3;const g=G_(master);n.connect(bp);bp.connect(g);g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(.12*v,at+.002);g.gain.exponentialRampToValueAtTime(.0001,at+.03);n.start(at);n.stop(at+.04)};
  for(let i=0;i<26;i++){const dash=Math.random()<.4,len=dash?.18:.07;click(t,1);click(t+len,.6);t+=len+.08+(i%5===4?.25:0)}}
 function whistle(){if(!ac)return;const t=ac.currentTime+.1;for(const f of[740,880,1110]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=ac.createBiquadFilter();lp.type='bandpass';lp.frequency.value=f;lp.Q.value=4;const g=G_(master);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.08);g.gain.setValueAtTime(.05,t+1.4);g.gain.linearRampToValueAtTime(0,t+1.8);o.connect(lp);lp.connect(g);o.start(t);o.stop(t+2)}}

/* ================= loop ================= */
function post(){

let last=performance.now();
function frame(t){
 const dt=Math.min(50,t-last);last=t;
 if(innerWidth!==W||innerHeight!==H)resize();
 if(!W||!H||!scene){requestAnimationFrame(frame);return}
 if(crane.walking){const d=crane.tx-crane.x,step=.3*dt;if(Math.abs(d)<=step){crane.x=crane.tx;crane.walking=false;const r=crane.res;crane.res=null;r&&r()}else{crane.x+=Math.sign(d)*step;crane.phase+=dt*.011}}

 post();
 for(const{h,el,lb,ex}of hsEls){const show=!h.show||h.show();const o=off(.25);
  if(ex){el.style.display='none';ex.style.display=show?'':'none';if(!show)continue;const cx=Math.max(34,Math.min(W-34,(h.x+h.w/2+o.x)*S+OX)),cy=Math.max(130,Math.min(H-80,(h.y+h.h/2+o.y)*S+OY));ex.style.left=cx+'px';ex.style.top=cy+'px';lb.style.left=Math.max(110,Math.min(W-110,cx))+'px';lb.style.top=(cy-28)+'px';continue}

  const cx=x+h.w*S/2;lb.style.left=Math.max(110,Math.min(W-110,cx))+'px';lb.style.top=Math.max(130,y+Math.min(h.h*S*.35,60))+'px'}
 requestAnimationFrame(frame)}

 verb:(id,label)=>{const h=scene.hs.find(x=>x.id===id);const v=h&&(h.verbs?h.verbs():[]).filter(Boolean).find(v=>v[0]===label);if(!v)return'no verb '+id+'/'+label;run(async()=>{if(label!=='Leave')await walkTo(h.wx);if(await blocked(h))return;await v[1]()});return'ok'},
 use:(it,id)=>{const h=scene.hs.find(x=>x.id===id);if(!h||!has(it))return'missing '+it+'/'+id;run(async()=>{await walkTo(h.wx);await useOn(it,h)});return'ok'},
