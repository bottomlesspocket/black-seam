<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Seam Pithead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap">
<style>
:root{--ink:#0b0705;--gold:#e9b86a;--cream:#f3e3c4;--muted:rgba(243,227,196,.62);--glass:rgba(20,12,8,.46);--line:rgba(233,184,106,.22)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:var(--cream);cursor:none}
#stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.chapter{position:absolute;left:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);opacity:0;animation:fadeIn 2.4s .6s ease forwards}
.chapter small{display:block;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);opacity:.85}
.chapter h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(28px,4vw,46px);line-height:1.05;margin-top:6px;letter-spacing:.01em}
.chapter p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(15px,1.5vw,18px);color:var(--muted);margin-top:4px}
.tools{position:absolute;right:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);display:flex;gap:10px;pointer-events:auto;opacity:0;animation:fadeIn 1.6s 1.4s ease forwards}
.tool{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--cream);transition:transform .25s,border-color .25s,background .25s;cursor:none}
.tool:hover{transform:translateY(-2px);border-color:rgba(233,184,106,.7);background:rgba(40,24,14,.6)}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#2a1709;font-size:10px;font-weight:500;display:grid;place-items:center;padding:0 5px}
.tool .tip{position:absolute;top:56px;right:0;white-space:nowrap;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);opacity:0;transform:translateY(-4px);transition:.2s;pointer-events:none}
.tool:hover .tip{opacity:1;transform:none}
.purse{position:absolute;right:clamp(16px,4vw,48px);top:calc(clamp(16px,4vh,40px) + 58px);font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:right;opacity:0;animation:fadeIn 1.6s 1.8s ease forwards}
.purse b{color:var(--cream);font-weight:500}
.sub{position:absolute;left:50%;bottom:clamp(20px,6vh,56px);transform:translateX(-50%);width:min(760px,calc(100% - 32px));text-align:center;opacity:0;transition:opacity .5s}
.sub.on{opacity:1}
.sub .who{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.sub .line{font-family:"Cormorant Garamond",serif;font-size:clamp(20px,2.4vw,28px);line-height:1.3;text-shadow:0 2px 18px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
.hs{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:auto;cursor:none}
.hs::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--cream);opacity:.0;box-shadow:0 0 0 0 rgba(243,227,196,.5);transition:opacity .4s}
body.reveal .hs::after{opacity:.55;animation:ping 2.2s infinite}
.label{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 22px));opacity:0;transition:opacity .2s,transform .2s;text-align:center;white-space:nowrap}
.label.on{opacity:1;transform:translate(-50%,calc(-100% - 30px))}
.label .name{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.label .verbs{margin-top:6px;display:flex;gap:6px;justify-content:center}
.label .verbs button{font:inherit;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--muted);cursor:none;transition:background .15s,color .15s,border-color .15s,transform .15s}
.label.open{pointer-events:auto}
.label.open .verbs button{font-size:13px;padding:8px 14px;color:var(--cream);border-color:rgba(233,184,106,.45)}
.label.open .verbs button:hover,.label.open .verbs button:active{color:#2a1709;background:var(--gold);border-color:var(--gold);transform:translateY(-1px)}
#cursor{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border:1px solid rgba(243,227,196,.75);border-radius:50%;pointer-events:none;transition:width .2s,height .2s,margin .2s,border-color .2s,background .2s;z-index:9}
#cursor::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:var(--cream)}
#cursor.hot{width:44px;height:44px;margin:-22px 0 0 -22px;border-color:var(--gold);background:rgba(233,184,106,.08)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:rgba(243,227,196,.38);opacity:0;animation:fadeIn 2s 3s ease forwards;white-space:nowrap}
#stage{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.tool.show .tip{opacity:1;transform:none}
.tool.look{display:none}
.tool.snd .off{display:none}.tool.snd.muted .on{display:none}.tool.snd.muted .off{display:block}.tool.snd.muted{color:var(--muted)}
body.reveal .tool.look{border-color:var(--gold);color:var(--gold)}
@media (pointer:coarse){
 .label.open .verbs button{font-size:14px;padding:10px 16px}
 .hs{width:76px;height:76px;margin:-38px 0 0 -38px}
 .hs::after{opacity:.4;animation:ping 2.6s infinite}
 body.reveal .hs::after{opacity:.9}
 .tool.look{display:grid}
 .tool{width:44px;height:44px}
}
.era{position:absolute;left:50%;top:clamp(16px,4vh,40px);transform:translateX(-50%);display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto;opacity:0;animation:fadeIn 1.6s 1s ease forwards}
.era button{position:relative;z-index:1;font:inherit;font-size:13px;padding:9px 16px;border:0;background:none;color:var(--muted);border-radius:999px;cursor:none;transition:color .4s;white-space:nowrap}
.era button b{font-weight:500;margin-right:6px;letter-spacing:.02em}
.era button.on{color:#2a1709}
.era .thumb{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--gold);transition:transform .55s cubic-bezier(.6,0,.2,1),width .55s cubic-bezier(.6,0,.2,1)}
.chapter>*,.purse{transition:opacity .45s}
.chapter,.purse,.hint{text-shadow:0 1px 14px rgba(10,20,30,.55),0 0 2px rgba(10,20,30,.35)}
.chapter.swap>*,.purse.swap{opacity:0}
body.before .badge{display:none}
@media (max-width:760px){.era{top:calc(clamp(16px,4vh,40px) + 104px)}.era button{font-size:12px;padding:8px 13px}}
@media (hover:none){.era button{cursor:auto}}
@keyframes fadeIn{to{opacity:1}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(243,227,196,.45)}80%,100%{box-shadow:0 0 0 14px rgba(243,227,196,0)}}
@media (hover:none){body{cursor:auto}#cursor{display:none}}
@media (max-width:600px){.purse{display:none}.tools{gap:8px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud" id="hud">
    <div class="chapter" id="chapter"><small id="chS">Prologue</small><h1 id="chH">The survey</h1><p id="chP">Cwm Du, Glamorgan · September 1869</p></div>
    <div class="era" id="era" role="group" aria-label="Time period"><span class="thumb" id="thumb"></span><button data-era="0" class="on"><b>1869</b>Before</button><button data-era="1"><b>1871</b>After</button></div>
    <div class="tools">
      <button class="tool snd muted" id="snd" aria-label="Music"><svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path d="M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg><span class="tip">Music off</span></button>
      <button class="tool look" id="look" aria-label="Show hotspots"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/><path d="M11 8v6M8 11h6"/></svg><span class="tip">Show hotspots</span></button>
      <button class="tool" aria-label="Ledger"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg><span class="badge">3</span><span class="tip">Ledger · people and leverage</span></button>
      <button class="tool" aria-label="Deeds"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M10 12h6M10 16h4"/><circle cx="6" cy="18" r="2.5"/></svg><span class="badge">2</span><span class="tip">Deeds · mineral rights</span></button>
      <button class="tool" aria-label="Secrets"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg><span class="badge">1</span><span class="tip">Secrets · yours and theirs</span></button>
    </div>
    <div class="purse" id="purse"><b>£38</b> · reputation: a stranger</div>
    <div class="sub" id="sub"><div class="who" id="who"></div><div class="line" id="line"></div></div>
    <div class="hint">Hold space to reveal hotspots</div>
  </div>
</div>
<div id="cursor"></div>
<script>
(()=>{
const VW=1600,VH=900;
const cv=document.getElementById('c'),main=cv.getContext('2d');let ctx=main;
const bufs=[0,1].map(()=>{const c=document.createElement('canvas');return{c,x:c.getContext('2d')}});
const hud=document.getElementById('hud'),cur=document.getElementById('cursor');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,S,OX,OY,pan=0,maxPan=0,laidOut=false;
const clampPan=p=>Math.max(-maxPan,Math.min(maxPan,p));
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;for(const b of bufs){b.c.width=W*DPR;b.c.height=H*DPR}S=Math.max(W/VW,Math.min(H/VH,W*1.9/VW));maxPan=Math.max(0,(VW*S-W)/2);
 if(!laidOut){pan=W/2-(560*S+(W-VW*S)/2);laidOut=true}
 pan=clampPan(pan);OX=(W-VW*S)/2+pan;OY=(H-VH*S)/2;}
addEventListener('resize',resize);resize();

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ridge(x,base,waves){let y=base;for(const[a,f,p]of waves)y+=a*Math.sin(x*f+p);return y}

const SUN={x:1130,y:612};
const LAYERS=[
 {d:.06,base:600,col:'#b86a3a',colB:'#9fbaa8',w:[[22,.004,1],[10,.011,2],[4,.03,0]]},
 {d:.12,base:630,col:'#8f4c2a',colB:'#7fa86a',w:[[30,.0032,4],[12,.009,1],[5,.026,3]]},
 {d:.22,base:672,col:'#5c321c',colB:'#5f9145',w:[[34,.0026,2.2],[14,.008,0.4],[5,.022,1]]},
];

let mx=0,my=0,tx=0,ty=0,px=-100,py=-100,mouse=!matchMedia('(pointer:coarse)').matches,drag=null,vel=0;
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.tool,.hs,.label,.era'))return;drag={x:e.clientX,p:pan,last:e.clientX,moved:false,id:e.pointerId};vel=0});
addEventListener('pointermove',e=>{
 if(e.pointerType==='mouse'){mouse=true;tx=(e.clientX/W)*2-1;ty=(e.clientY/H)*2-1;px=e.clientX;py=e.clientY;cur.style.transform=`translate(${px}px,${py}px)`}
 if(drag&&e.pointerId===drag.id&&maxPan>0){const dx=e.clientX-drag.x;if(Math.abs(dx)>6)drag.moved=true;vel=e.clientX-drag.last;drag.last=e.clientX;pan=clampPan(drag.p+dx)}});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.moved)clearLabels();drag=null};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
const off=d=>({x:-mx*d*42,y:-my*d*12});

const grain=document.createElement('canvas');grain.width=grain.height=220;
{const g=grain.getContext('2d'),im=g.createImageData(220,220),r=rng(7);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}
const grainPat=ctx.createPattern(grain,'repeat');

const r1=rng(11);
const cottages=[];for(let i=0;i<9;i++)cottages.push({x:90+i*30,lit:r1()>.4,ph:r1()*6});
const tufts=[];for(let i=0;i<160;i++)tufts.push({x:-80+r1()*1760,h:6+r1()*18,l:r1()*2-1});
const motes=[];for(let i=0;i<70;i++)motes.push({x:r1()*VW,y:300+r1()*520,r:.6+r1()*1.8,v:.1+r1()*.3,ph:r1()*6});
const sheep=[];for(let i=0;i<14;i++)sheep.push({x:930+r1()*520,dy:26+r1()*44,dir:r1()>.5?1:-1,ph:r1()*6});
const r2=rng(23),leaves=[];for(let i=0;i<160;i++){const a=r2()*Math.PI*2,rr=Math.sqrt(r2())*90;leaves.push({x:840+Math.cos(a)*rr*1.15+20,y:470+Math.sin(a)*rr*.9,r:1.2+r2()*2.6})}
const r3=rng(41),clouds=[];for(let i=0;i<7;i++){const n=5+(r3()*4|0),puffs=[];for(let j=0;j<n;j++){const dx=(j/(n-1)-.5)*150+r3()*16;puffs.push([dx,-Math.cos(dx/90)*22+r3()*8,20+r3()*24+Math.cos(dx/80)*10])}clouds.push({x:r3()*2100,y:90+r3()*250,v:.004+r3()*.006,s:.6+r3()*.6,puffs})}
const smoke=[];
function spawnSmoke(){smoke.push({x:520+(Math.random()-.5)*8,y:300,r:10,a:.55,vx:.25+Math.random()*.2,vy:-(.55+Math.random()*.35),g:.18+Math.random()*.14})}
for(let i=0;i<120;i++){spawnSmoke();const s=smoke[smoke.length-1];for(let k=0;k<i*3;k++){s.x+=s.vx+k*.0016;s.y+=s.vy;s.r+=s.g;s.a*=.9975}}

const P=f=>{const p=new Path2D();f(p);return p};
const CR={
 legs:P(p=>{
  p.moveTo(-16,-48);p.lineTo(-6,-48);p.lineTo(-7,-11);p.lineTo(-17,-11);p.closePath();
  p.moveTo(4,-48);p.lineTo(14,-48);p.lineTo(18,-11);p.lineTo(8,-11);p.closePath();
  p.moveTo(-18,-13);p.lineTo(-7,-13);p.quadraticCurveTo(-1,-7,3,-3);p.lineTo(3,0);p.lineTo(-19,0);p.closePath();
  p.moveTo(7,-13);p.lineTo(18,-13);p.quadraticCurveTo(24,-7,29,-3);p.lineTo(29,0);p.lineTo(6,0);p.closePath()}),
 coat:P(p=>{
  p.moveTo(-11,-204);p.quadraticCurveTo(-25,-199,-30,-187);p.quadraticCurveTo(-33,-160,-30,-128);p.quadraticCurveTo(-34,-88,-40,-48);
  p.quadraticCurveTo(-29,-42,-19,-45);p.lineTo(-12,-62);p.lineTo(-6,-44);p.quadraticCurveTo(15,-41,38,-47);
  p.quadraticCurveTo(34,-86,31,-124);p.quadraticCurveTo(33,-168,26,-188);p.quadraticCurveTo(17,-198,8,-200);p.closePath();
  p.moveTo(-15,-208);p.lineTo(-7,-195);p.lineTo(9,-195);p.lineTo(12,-203);p.quadraticCurveTo(0,-199,-15,-208);p.closePath()}),
 armR:P(p=>{p.moveTo(22,-185);p.quadraticCurveTo(37,-160,41,-118);p.lineTo(43,-110);p.lineTo(33,-107);p.lineTo(31,-118);p.quadraticCurveTo(28,-150,16,-172);p.closePath()}),
 hands:P(p=>{p.ellipse(38,-104,4.6,5,0,0,Math.PI*2);p.moveTo(-26,-104);p.ellipse(-30,-104,4,5.6,.2,0,Math.PI*2)}),
 head:P(p=>{
  p.moveTo(-11,-227);p.quadraticCurveTo(-16,-214,-12,-204);p.lineTo(-9,-197);p.lineTo(8,-196);
  p.quadraticCurveTo(13,-199,14,-203);p.lineTo(17,-205);p.lineTo(15.5,-208);p.lineTo(19,-211);p.lineTo(15.5,-217);p.quadraticCurveTo(14.5,-225,10,-228);p.closePath()}),
 topHat:P(p=>{
  p.moveTo(-13,-229);p.lineTo(-14.5,-259);p.quadraticCurveTo(0,-262,15.5,-259);p.lineTo(14,-229);p.closePath();
  p.moveTo(-25,-227);p.quadraticCurveTo(-23,-233,-12,-232);p.lineTo(12,-232);p.quadraticCurveTo(24,-233,27,-228);p.quadraticCurveTo(21,-223.5,0,-225);p.quadraticCurveTo(-19,-223.5,-25,-227);p.closePath()}),
 bowler:P(p=>{
  p.moveTo(-14,-229);p.quadraticCurveTo(-15,-250,1,-251);p.quadraticCurveTo(16,-250,16,-229);p.closePath();
  p.moveTo(-21,-227);p.quadraticCurveTo(-17,-231.5,-8,-230.5);p.lineTo(10,-230.5);p.quadraticCurveTo(20,-231.5,23,-227.5);p.quadraticCurveTo(17,-224,0,-225);p.quadraticCurveTo(-16,-224,-21,-227);p.closePath()})
};

function rimFill(path,dark,rim,dx,dy){ctx.save();ctx.clip(path);ctx.fillStyle=rim;ctx.fill(path);ctx.translate(dx,dy);ctx.fillStyle=dark;ctx.fill(path);ctx.restore()}

const HOT=[
 {era:0,id:'farm',name:'Pen-y-graig farm',vx:630,vy:640,d:.4,verbs:[
   ['Look','Elias Crane','Forty acres of thin grass and stubborn Welsh pride.'],
   ['Knock','Gwen Rees','We’ve no money for pedlars, sir. Nor for surveyors.']]},
 {era:0,id:'oak',name:'Old oak',vx:830,vy:470,d:.4,verbs:[
   ['Look','Elias Crane','Three hundred years old, give or take. It’ll make fine pit props.'],
   ['Rest','Elias Crane','Not yet. Rest is for men who’ve already won.']]},
 {era:0,id:'sheep',name:'Rees’s flock',vx:1150,vy:720,d:.22,verbs:[
   ['Look','Elias Crane','Grazing on a fortune, and none the wiser.'],
   ['Count','Elias Crane','Thirty-one sheep. Thirty-one reasons she thinks she’s rich.']]},
 {era:0,id:'theo',name:'Theodolite',vx:506,vy:650,d:.8,verbs:[
   ['Survey','Elias Crane','The strata dip east. If I’m right, the seam runs under every farm on this hill.'],
   ['Pack away','Elias Crane','Best not be seen measuring. People start asking what for.']]},
 {era:0,id:'chapel0',name:'Bethel chapel',vx:1318,vy:600,d:.3,verbs:[
   ['Look','Elias Crane','A new chapel, half paid for. Pryce will be wanting a benefactor.'],
   ['Visit Pryce','Rev. Owain Pryce','A surveyor? Then you’ll find this valley’s souls harder to measure than its rock.']]},
 {era:0,id:'crane0',name:'Elias Crane',vx:378,vy:690,d:1,verbs:[
   ['Think','Elias Crane','Grazing land, they call it. Grazing.'],
   ['Check notebook','Elias Crane','Not one deed yet. Only a notebook of figures no one else has seen.']]},
 {era:1,id:'frame',name:'Winding gear',vx:808,vy:410,d:.4,verbs:[
   ['Inspect','Elias Crane','Forty fathoms down, and the seam runs as thick as a man is tall.'],
   ['Climb','Elias Crane','Not in this coat. That’s what the banksman is for.']]},
 {era:1,id:'engine',name:'Engine house',vx:622,vy:600,d:.4,verbs:[
   ['Look','Elias Crane','Sixty horsepower, bought on credit and a handshake.'],
   ['Talk to banksman','Banksman Evans','I saw nothing on the third of May, Mr Crane. Nothing at all.']]},
 {era:1,id:'chapel',name:'Bethel chapel',vx:1318,vy:600,d:.3,verbs:[
   ['Look','Elias Crane','Pryce rings that bell for God. He can ring it for me a while.'],
   ['Visit Pryce','Rev. Owain Pryce','The Lord keeps a ledger too, Mr Crane. Yours is not yet balanced.']]},
 {era:1,id:'tub',name:'First coal',vx:1012,vy:790,d:.8,verbs:[
   ['Examine','Elias Crane','Hard, clean steam coal. The Admiralty would pay double for it.'],
   ['Take','Elias Crane','Worth more as a rumour than it’ll ever be as fuel.']]},
 {era:1,id:'crane',name:'Elias Crane',vx:378,vy:690,d:1,verbs:[
   ['Think','Elias Crane','Every farm on this hill is mine. They just don’t know it yet.'],
   ['Check ledger','Elias Crane','Three farms signed. The widow Rees holds the key to the rest.']]},
